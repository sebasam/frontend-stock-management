<div class="max-w-5xl mx-auto p-4 md:p-6 lg:py-10">
  
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
    <h2 class="text-2xl font-bold text-gray-800">Current Inventory</h2>
    <button (click)="logout()" class="px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 font-medium rounded-lg transition-colors border border-red-200">
      Logout
    </button>
  </div>
  
  <!-- Formulario de Movimientos -->
  <app-movement-form [products]="products" (movementRegistered)="loadInventory()"></app-movement-form>

  <!-- Tabla del Inventario -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-200">
            <th class="p-4 text-sm font-semibold text-gray-600">ID</th>
            <th class="p-4 text-sm font-semibold text-gray-600">Product Name</th>
            <th class="p-4 text-sm font-semibold text-gray-600 text-right">Available Quantity</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <tr *ngFor="let product of products" class="hover:bg-gray-50 transition-colors">
            <td class="p-4 text-sm text-gray-600">#{{ product.id }}</td>
            <td class="p-4 text-sm font-medium text-gray-800">{{ product.name }}</td>
            <td class="p-4 text-sm font-bold text-right" [ngClass]="{'text-red-600': product.quantity === 0, 'text-gray-800': product.quantity > 0}">
              {{ product.quantity }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
