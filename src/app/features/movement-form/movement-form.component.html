<div class="bg-white p-5 md:p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
  <h3 class="text-lg font-bold text-gray-800 mb-4">Register Movement</h3>
  
  <form [formGroup]="movementForm" (ngSubmit)="onSubmit()" class="flex flex-col md:flex-row gap-4 items-start md:items-end">
    
    <div class="w-full md:flex-1">
      <label class="block text-sm font-medium text-gray-700 mb-1">Product</label>
      <select formControlName="productId" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
        <option value="" disabled selected>Select a product...</option>
        <option *ngFor="let p of products" [value]="p.id">{{ p.name }}</option>
      </select>
    </div>
    
    <div class="w-full md:w-48">
      <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
      <select formControlName="type" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
        <option [value]="0">Entry (In)</option>
        <option [value]="1">Exit (Out)</option>
      </select>
    </div>
    
    <div class="w-full md:w-32">
      <label class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
      <input type="number" formControlName="quantity" min="1" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    
    <button type="submit" [disabled]="movementForm.invalid" 
            class="w-full md:w-auto px-6 py-2 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed">
      Register
    </button>
  </form>
  
  <p *ngIf="message" [ngClass]="isError ? 'text-red-600 bg-red-50' : 'text-green-700 bg-green-50'" class="mt-4 p-3 rounded-lg text-sm font-medium">
    {{ message }}
  </p>
</div>
